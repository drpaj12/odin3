name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache clang clang-format clang-tidy cppcheck libreadline-dev
      - name: Install Python dev tools
        run: pip install -r requirements-dev.txt
      - name: Lint gate (clang-format, clang-tidy, cppcheck, lizard, ruff, mypy)
        run: tools/lint.sh

  build:
    name: build (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache clang libreadline-dev
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dev tools (cffi for the Python plugin test)
        run: |
          pip install -r requirements-dev.txt
          echo "Python3_ROOT=$pythonLocation" >> "$GITHUB_ENV"  # make CMake pick this Python
      - name: Record submodule commits
        id: submodules
        run: echo "shas=$(git submodule status --recursive | awk '{print $1}' | tr -d '+-' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ matrix.cc }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}-${{ steps.submodules.outputs.shas }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.cc }}-
      - name: Debug (ASan + UBSan) configure, build, test
        run: |
          cmake --preset debug
          cmake --build --preset debug
          ctest --preset debug --output-on-failure
      - name: Release configure and build
        run: |
          cmake --preset release
          cmake --build --preset release
      - name: ccache statistics
        if: always()
        run: ccache --show-stats

  # Aggregator. Branch protection requires a check named exactly "ci"; the matrix job above is
  # reported as "build (gcc)" / "build (clang)", so this single job stands in for both.
  ci:
    name: ci
    needs: [lint, build]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require lint and build to have succeeded
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          echo "lint=$LINT_RESULT build=$BUILD_RESULT"
          if [ "$LINT_RESULT" != success ] || [ "$BUILD_RESULT" != success ]; then
            echo "::error::lint and build must both succeed"
            exit 1
          fi
