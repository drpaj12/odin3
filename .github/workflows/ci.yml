name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache clang clang-format clang-tidy cppcheck libreadline-dev bison flex
      - name: Install Python dev tools
        run: pip install -r requirements-dev.txt
      - name: Lint gate (clang-format, clang-tidy, cppcheck, lizard, ruff, mypy)
        run: tools/lint.sh

  build:
    name: build (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    # The debug leg builds and runs the ASan + UBSan suite for the vendored slang (1209 objects
    # per configuration; gcc's ctest alone takes 36 min), then builds release. 45 min cut the
    # gcc leg off inside the release build; 90 leaves room for a cold ccache.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # 1G held neither slang's debug nor its release objects plus the core: the failed gcc run
      # restored a cache that was 1.0/1.0 GB (98.43%) full, so entries were evicted between runs.
      CCACHE_MAXSIZE: 2G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache clang libreadline-dev iverilog yosys time bison flex
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dev tools (cffi for the Python plugin test)
        run: |
          pip install -r requirements-dev.txt
          echo "Python3_ROOT=$pythonLocation" >> "$GITHUB_ENV"  # make CMake pick this Python
      - name: Record submodule commits
        id: submodules
        run: echo "shas=$(git submodule status --recursive | awk '{print $1}' | tr -d '+-' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          # github.sha makes every run save a fresh cache; restore-keys picks up the newest prior one.
          key: ccache-${{ runner.os }}-${{ matrix.cc }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}-${{ steps.submodules.outputs.shas }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.cc }}-
      - name: Debug (ASan + UBSan) configure, build, test
        env:
          ODIN3_REQUIRE_CFFI: '1'  # python_walk (the Phase 1 exit test) fails, not skips, without cffi
        run: |
          cmake --preset debug
          cmake --build --preset debug
          ctest --preset debug --output-on-failure
      - name: Fuzz smoke (clang libFuzzer, ASan + UBSan; 2B §10.5, 2C §7.5, 3D §13.7)
        if: matrix.cc == 'clang'
        run: |
          cmake -S . -B build/fuzz -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug \
            -DODIN3_FUZZ=ON -DODIN3_WITH_ABC=OFF -DODIN3_WITH_SLANG=OFF
          cmake --build build/fuzz --target fuzz_pp fuzz_verilog fuzz_abc_script fuzz_elab fuzz_opt fuzz_abc_splice fuzz_lower
          ctest --test-dir build/fuzz -L fuzz --output-on-failure
      - name: Release configure and build (ABC already covered by the debug build)
        run: |
          cmake --preset release -DODIN3_WITH_ABC=OFF
          cmake --build --preset release
      - name: SystemVerilog adapter built (v1.1.0, DESIGN 4.2)
        run: |
          test -f build/debug/libodin3_slang.so
          test -f build/release/libodin3_slang.so
          # The oracle cli_slang_flow requires: the distribution's Yosys (any with techmap works;
          # the refs are equivalent under 0.55 and 0.69+). Printed so CI records which one ran.
          yosys -V
      - name: ccache statistics
        if: always()
        run: ccache --show-stats

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache libreadline-dev bison flex
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install Sphinx and extensions
        run: pip install -r requirements-docs.txt
      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-docs-${{ github.sha }}
          restore-keys: ccache-docs-
      # The pass reference is generated from `odin3 --help` (docs/user/_ext/passes_ref.py).
      - name: Build odin3
        run: |
          cmake --preset release
          cmake --build --preset release --target odin3
      - name: Build the documentation (warnings are errors)
        run: sphinx-build -W -b html docs/user build/docs

  # Aggregator. Branch protection requires a check named exactly "ci"; the matrix job above is
  # reported as "build (gcc)" / "build (clang)", so this single job stands in for both.
  ci:
    name: ci
    needs: [lint, build, docs]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require lint, build and docs to have succeeded
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          echo "lint=$LINT_RESULT build=$BUILD_RESULT docs=$DOCS_RESULT"
          if [ "$LINT_RESULT" != success ] || [ "$BUILD_RESULT" != success ] \
             || [ "$DOCS_RESULT" != success ]; then
            echo "::error::lint, build and docs must all succeed"
            exit 1
          fi
