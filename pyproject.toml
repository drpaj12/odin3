[project]
name = "odin3-tools"
version = "0.0.1"
description = "Python tooling for Odin III: netlist-compare, equiv-check and the cffi plugin binding"
license = "MIT"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
# Directories holding stand-alone modules (no packages) so isort treats them as first-party.
src = ["tools/blif", "tools/netlist-compare", "tools/equiv-check", "tools/golden-sample",
       "tools/golden-blackboxes", "tools/token-cost",
       "tools/project-fixtures", "plugins/python"]
extend-exclude = ["third_party", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90"]

[tool.ruff.lint.mccabe]
# Mirrors the C rule (lizard -C 15).
max-complexity = 15

[tool.mypy]
strict = true
python_version = "3.10"
# The tools are stand-alone scripts that add these directories to sys.path at run time.
mypy_path = "tools/blif:tools/netlist-compare:tools/equiv-check:tools/golden-sample:tools/golden-blackboxes:tools/token-cost:tools/project-fixtures"
exclude = ["^third_party/", "^build/"]

[[tool.mypy.overrides]]
module = ["cffi", "cffi.*"]
ignore_missing_imports = true
