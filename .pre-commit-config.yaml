# Install once with: pre-commit install
# The hygiene hooks need the network only for the initial `pre-commit install`/first run (to
# clone the pinned hooks repo); the local lint hook needs none.
exclude: '^third_party/|\.blif$'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # tests/micro/ is verbatim upstream Verilog (some are whitespace/syntax tests): never rewrite it
      # tests/tools/fixtures/vtr_qor/ holds VTR's own output: parse rows end with a tab
      # tests/tools/fixtures/timing_attr_v2/*.names are name maps: their last field may be empty (a tab); prov_post holds raw VPR .net and .place files too
      - id: trailing-whitespace
        exclude: '^tests/micro/|^tests/tools/fixtures/vtr_qor/|^tests/tools/fixtures/timing_attr_v2/.*\.names$|^tests/tools/fixtures/prov_post/.*\.(net|place|names)$'
      - id: end-of-file-fixer
        exclude: '^tests/micro/|^tests/tools/fixtures/vtr_qor/|^tests/tools/fixtures/timing_attr_v2/.*\.names$|^tests/tools/fixtures/prov_post/.*\.(net|place|names)$'
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      # main is protected on GitHub; this stops the commit locally too (CLAUDE.md rule 5).
      - id: no-commit-to-branch
        args: ['--branch', 'main']
  - repo: local
    hooks:
      # Fast gate: everything in tools/lint.sh except clang-tidy (slow; CI runs the full gate).
      - id: odin3-lint
        name: tools/lint.sh --no-tidy
        entry: tools/lint.sh --no-tidy
        language: system
        pass_filenames: false
        always_run: true
